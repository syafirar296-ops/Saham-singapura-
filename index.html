<meta name="apple-mobile-web-app-title" content="Saham SG">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<title>Saham Singapura</title>
<style>
:root{--bg:#000;--panel:#0b1317;--line:#1d2b32;--txt:#f2f6f7;--mut:#8b9ba3;--g:#22e07a;--r:#ff4d4d;--p:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
#app{height:100dvh;display:flex;flex-direction:column;gap:4px;padding:max(8px,env(safe-area-inset-top)) 0 max(6px,env(safe-area-inset-bottom))}
header{padding:0 10px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;flex:none;border-radius:50%}
.ttl{flex:1;min-width:0}
h1{font-size:18px;line-height:1.1;font-weight:800;letter-spacing:-.3px}
h1 b{color:var(--g)}
.sub{font-size:10px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#live{flex:none;display:flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:11px;line-height:1.2;color:#cfe0e6;cursor:pointer;max-width:130px}
#live i{width:9px;height:9px;border-radius:50%;background:var(--g);box-shadow:0 0 8px var(--g);flex:none}
#live.err i{background:var(--p);box-shadow:0 0 8px var(--p)}
#live.load i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.stats{padding:0 8px;display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:7px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:5px 7px;display:flex;align-items:center;gap:6px;min-width:0}
.card svg{width:19px;height:19px;flex:none}
.card .v{font-size:13px;font-weight:800;line-height:1.1;white-space:nowrap}
.card .l{font-size:8.5px;color:var(--mut);margin-top:1px;white-space:nowrap}
.up{color:var(--g)}.dn{color:var(--r)}.nu{color:var(--p)}
.bar{padding:0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{flex:1;display:flex;border:1px solid #16232a;border-radius:14px;background:#000;overflow:hidden}
.seg button{flex:1;background:none;border:0;color:var(--mut);font-weight:700;font-size:10px;padding:6px 2px;white-space:nowrap}
.seg button.on{background:#0f1a20;color:var(--txt);box-shadow:inset 0 -2px 0 var(--g)}
.hint{font-size:11px;color:var(--mut);text-align:right}
.bar{position:relative}
#rgb{flex:none;display:flex;align-items:center;gap:6px;background:#000;border:1px solid #16232a;border-radius:14px;color:var(--txt);font-weight:700;font-size:10px;padding:7px 10px;white-space:nowrap}
#rgb svg{width:9px;height:6px}
#rgm{position:absolute;right:6px;top:calc(100% + 4px);z-index:15;display:none;flex-direction:column;background:#000;border:1px solid #1d2b32;border-radius:16px;padding:4px;max-height:52vh;overflow-y:auto;box-shadow:0 12px 36px rgba(0,0,0,.9);min-width:120px}
#rgm.open{display:flex}
#rgm button{background:none;border:0;color:#cfe0e6;font-weight:700;font-size:12px;text-align:left;padding:9px 12px;border-radius:11px}
#rgm button.on{background:#0f1a20;color:var(--g)}
#ld{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#000;color:var(--mut);font-size:12px;font-weight:700;transition:opacity .35s;pointer-events:none}
#ld.off{opacity:0}
#stage{position:relative;flex:1;min-height:0;margin:2px 0 8px;border-radius:28px;overflow:hidden;background:#04090c;border:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

<script>
(function(){
'use strict';
/* ====== PENGATURAN ====== */
const TV_URL='https://scanner.tradingview.com/singapore/scan';
const PROXIES=['','https://corsproxy.io/?url='];
const MAXN=1000;           // semua saham SGX (maks 1000, urut kapitalisasi)
const NEUTRAL=0.005;
const REFRESH_MS=20000;
const CACHE_KEY='sg_cache2', LOGO_KEY='sg_logos2';
const COL={g:[34,224,122],r:[255,77,77],p:[167,139,250]};
const tf='24h';
let sortBy='pop';
let rangeIdx=-1;
const DPR=Math.min(window.devicePixelRatio||1,2);
const $=id=>document.getElementById(id);
const stage=$('stage'),cv=$('cv'),ctx=cv.getContext('2d');
const coins=[];const byId=new Map();let list=[];let demo=false;
let W=0,H=0;const view={k:1,x:0,y:0};let selected=null;
let lastT=0,isLive=false;

/* ====== FORMAT ====== */
const nf0=new Intl.NumberFormat('id-ID',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('id-ID',{maximumFractionDigits:2});
const nfc=new Intl.NumberFormat('id-ID',{notation:'compact',maximumFractionDigits:1});
const nf3=new Intl.NumberFormat('id-ID',{minimumFractionDigits:3,maximumFractionDigits:3});
const fmtP=p=>(p==null||!isFinite(p))?'-':'S$ '+(Math.abs(p)>=100?nf0.format(p):Math.abs(p)>=1?nf2.format(p):nf3.format(p));
const fmtCap=v=>{if(!v||!isFinite(v))return'-';if(v>=1e12)return'S$ '+nf2.format(v/1e12)+' T';if(v>=1e9)return'S$ '+nf2.format(v/1e9)+' Mlr';return'S$ '+nf0.format(v/1e6)+' jt';};
const fmtC=v=>(v>0?'+':'')+v.toFixed(2)+'%';
const clsOfV=v=>v>NEUTRAL?'g':v<-NEUTRAL?'r':'p';
const chg=c=>c.ch[tf]||0;
const cls=c=>clsOfV(chg(c));
const css=k=>k==='g'?'up':k==='r'?'dn':'nu';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ====== LOGO: cache IndexedDB (SVG vektor -> tajam di zoom berapa pun) ====== */
const logoImg={},logoSrc={},logoFail={},logoRetry={};let flagsVer=0,fvT=null;
const logoQ=[];let logoAct=0,pendingDecode=0,logoWarm=true,warmUntil=0;
const logoUrl=k=>'https://s3-symbol-logo.tradingview.com/'+k+'--big.svg';
function bumpFlags(){}
const idbP=new Promise(res=>{try{const rq=indexedDB.open('sglogo',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('l');rq.onsuccess=()=>res(rq.result);rq.onerror=()=>res(null);}catch(e){res(null);}});
function idbAll(){return idbP.then(db=>new Promise(res=>{const out={};if(!db)return res(out);try{const st=db.transaction('l').objectStore('l'),rk=st.getAllKeys(),rv=st.getAll();rv.onsuccess=()=>{const K=rk.result||[],V=rv.result||[];for(let i=0;i<K.length;i++)out[K[i]]=V[i];res(out);};rv.onerror=()=>res(out);}catch(e){res(out);}}));}
function idbPut(k,v){idbP.then(db=>{if(!db)return;try{db.transaction('l','readwrite').objectStore('l').put(v,k);}catch(e){}});}
function setLogo(k,src){
  logoSrc[k]=src;
  const im=new Image();
  const bad=()=>{delete logoSrc[k];if(!logoRetry[k]){logoRetry[k]=1;logoQ.push(k);pumpLogos();}};
  pendingDecode++;
  im.onload=()=>{pendingDecode--;if(!im.naturalWidth){bad();return;}logoImg[k]=im;bumpFlags();};
  im.onerror=()=>{pendingDecode--;bad();};
  im.src=src;
}
const t00=performance.now();
function endWarm(){
  const chk=()=>{if(!logoWarm)return;if(pendingDecode<=0||performance.now()-t00>1200){logoWarm=false;warmUntil=performance.now()+2500;}else setTimeout(chk,16);};
  chk();
}
setTimeout(()=>{logoWarm=false;warmUntil=performance.now()+1500;},1600);
const logosReady=idbAll().then(o=>new Promise(res=>{
  const rk={};coins.forEach((c,i)=>{if(c.logo&&rk[c.logo]==null)rk[c.logo]=i;});
  const keys=Object.keys(o).sort((a,b)=>(rk[a]==null?1e9:rk[a])-(rk[b]==null?1e9:rk[b]));
  let i=0;
  (function step(){const t0=performance.now();while(i<keys.length&&performance.now()-t0<24){setLogo(keys[i],o[keys[i]]);i++;}
    if(i<keys.length)requestAnimationFrame(step);else{res();endWarm();}})();
}));
function requestLogos(){
  logosReady.then(()=>{
    coins.forEach(c=>{const k=c.logo;if(k&&!logoSrc[k]&&!logoFail[k]&&logoQ.indexOf(k)<0)logoQ.push(k);});
    pumpLogos();
  });
}
function pngLogo(k,done){
  const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{
    try{
      const cn=document.createElement('canvas');cn.width=cn.height=256;
      cn.getContext('2d').drawImage(im,0,0,256,256);
      const u=cn.toDataURL('image/png');setLogo(k,u);idbPut(k,u);
    }catch(e){logoImg[k]=im;logoSrc[k]=im.src;bumpFlags();}
    done();
  };
  im.onerror=()=>{
    const i2=new Image();
    i2.onload=()=>{logoImg[k]=i2;logoSrc[k]=i2.src;bumpFlags();done();};
    i2.onerror=()=>{logoFail[k]=1;done();};
    i2.src=logoUrl(k);
  };
  im.src=logoUrl(k);
}
function fetchLogo(k,done){
  fetch(logoUrl(k)).then(r=>{if(!r.ok)throw 0;return r.text();}).then(t=>{
    if(t.indexOf('<svg')<0)throw 0;
    const u='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(t),im=new Image();
    im.onload=()=>{if(im.naturalWidth){logoSrc[k]=u;logoImg[k]=im;bumpFlags();idbPut(k,u);done();}else pngLogo(k,done);};
    im.onerror=()=>pngLogo(k,done);
    im.src=u;
  }).catch(()=>pngLogo(k,done));
}
function pumpLogos(){
  while(logoAct<24&&logoQ.length){
    const k=logoQ.shift();logoAct++;
    fetchLogo(k,()=>{logoAct--;pumpLogos();});
  }
}
function logoHTML(c){
  const s=c.logo&&logoSrc[c.logo];
  return s?'<img alt="" style="background:#fff" src="'+s+'">':'<div class="fe" style="font-size:11px;font-weight:800">'+c.sym.slice(0,3)+'</div>';
}

/* ====== DATA ====== */
function ingest(arr){
  arr.forEach(d=>{
    let c=byId.get(d.id);
    if(!c){c={id:d.id,vx:0,vy:0,free:false,st:0,x:null,y:null,r:0,tx:null,ty:null,tr:0,ph:Math.random()*6.28,fr:.6+Math.random()*.8,sp:null};byId.set(d.id,c);coins.push(c);}
    c.sym=d.sym;c.name=d.name||d.sym;c.price=d.price;c.dt=d.dt||{};c.logo=c.dt.logo||c.logo||null;
    c.cap=c.dt.cap||0;
    c.score=Math.log10((c.cap||0)+1e8);
    c.tv=Math.log10((d.price||1)*(c.dt.vol||0)+10);
    const v=d.ch;c.ch={'24h':(v==null||!isFinite(v))?0:v};
  });
  coins.sort((a,b)=>(b.cap||0)-(a.cap||0));
  coins.forEach((c,i)=>c.rank=i+1);
}
const COLSETS=[
  {cols:['name','description','close','change','change_abs','high','low','open','volume','market_cap_basic','logoid','sector'],filter:true},
  {cols:['name','description','close','change','volume','market_cap_basic','logoid'],filter:true},
  {cols:['name','description','close','change','volume','market_cap_basic','logoid'],filter:false}
];
function tvBody(cs){
  const b={options:{lang:'en'},markets:['singapore'],symbols:{query:{types:[]},tickers:[]},columns:cs.cols,
    sort:{sortBy:'market_cap_basic',sortOrder:'desc'},range:[0,MAXN]};
  if(cs.filter)b.filter=[{left:'type',operation:'equal',right:'stock'}];
  return JSON.stringify(b);
}
function mapTV(j,cols){
  const out=[];
  j.data.forEach(r=>{
    const o={};cols.forEach((k,i)=>{o[k]=r.d[i];});

/* ====== LAYOUT (packing gelembung) ====== */
const LAYOUT_KEY='sg_layout1';
function loadLayout(L){
  if(sortBy!=='pop')return false;
  try{
    const j=JSON.parse(localStorage.getItem(LAYOUT_KEY)||'null');
    if(!j||j.n!==L.length||Math.abs(j.W-W)>W*.06||Math.abs(j.H-H)>H*.06)return false;
    for(const c of L)if(!j.p[c.id])return false;
    const fx=W/j.W,fy=H/j.H,fr=Math.min(fx,fy);
    L.forEach(c=>{const q=j.p[c.id];c.tr=q[0]*fr;c.tx=q[1]*fx;c.ty=q[2]*fy;});
    return true;
  }catch(e){return false;}
}
function saveLayout(L){
  if(sortBy!=='pop')return;
  try{const p={};L.forEach(c=>{p[c.id]=[+c.tr.toFixed(2),+c.tx.toFixed(1),+c.ty.toFixed(1)];});
    localStorage.setItem(LAYOUT_KEY,JSON.stringify({W:W,H:H,n:L.length,p:p}));}catch(e){}
}
function finishLayout(L){list=L.slice().sort((a,b)=>b.tr-a.tr);}
function orderedAll(){
  const a=coins.slice();
  if(sortBy==='pop')a.sort((x,y)=>(y.cap||0)-(x.cap||0));
  else if(sortBy==='vol')a.sort((x,y)=>y.tv-x.tv);
  else if(sortBy==='gain')a.sort((x,y)=>chg(y)-chg(x));
  else a.sort((x,y)=>chg(x)-chg(y));
  return a;
}
function fastSwitch(){warmUntil=performance.now()+2200;}
function relayout(soft){
  if(!W||!coins.length)return;
  const all=orderedAll();
  const L=rangeIdx<0?all:all.slice(rangeIdx*100,rangeIdx*100+100);
  if(!L.length){list=[];return;}
  if(soft&&list.length===L.length){const cur=new Set(list);let same=true;for(const c of L){if(!cur.has(c)){same=false;break;}}if(same)return;}
  const prevSet=new Set(list),Ls=new Set(L),leaving=[];
  list.forEach(c=>{if(!Ls.has(c)&&c.r>.3){c.out=true;c.tr=0;c.free=false;c.vx=c.vy=0;leaving.push(c);}});
  const enter=[];L.forEach(c=>{c.out=false;if(prevSet.size&&!prevSet.has(c))enter.push(c);});
  let area=0;
  /* ukuran berdasarkan peringkat (L sudah terurut) -> selisih ukuran kecil, semua bola besar */
  const N=L.length;
  const big=N>250?3.6:1.1,span=Math.max(8,N*(N>250?.09:.25));
  L.forEach((c,i)=>{const n=N>1?1-i/(N-1):1;const boost=Math.pow(Math.max(0,1-i/span),1.5)*big;c.w=.55+.95*Math.pow(n,.75)+boost;});
  L.forEach(c=>{area+=Math.PI*c.w*c.w;});
  const s=Math.sqrt((L.length<=250?.78:.64)*W*H/area);
  L.forEach(c=>{c.tr=c.w*s;if(c.tx==null){c.tx=Math.random()*W;c.ty=Math.random()*H;}});
  const n=L.length;let rmax=0;L.forEach(c=>{if(c.tr>rmax)rmax=c.tr;});
  const cell=Math.max(8,rmax*2+1),cols=Math.ceil(W/cell)+1,rows=Math.ceil(H/cell)+1;
  const head=new Int32Array(cols*rows),next=new Int32Array(n);
  for(let it=0;it<200;it++){
    head.fill(-1);
    for(let i=0;i<n;i++){const c=L[i];const g=Math.floor(c.tx/cell)+Math.floor(c.ty/cell)*cols;next[i]=head[g];head[g]=i;}
    let worst=0;
    for(let i=0;i<n;i++){
      const a=L[i],gx=Math.floor(a.tx/cell),gy=Math.floor(a.ty/cell);
      for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){
        const X=gx+ox,Y=gy+oy;if(X<0||Y<0||X>=cols||Y>=rows)continue;
        for(let j=head[X+Y*cols];j>=0;j=next[j]){
          if(j<=i)continue;const b=L[j];
          let dx=b.tx-a.tx,dy=b.ty-a.ty,d=Math.hypot(dx,dy),m=a.tr+b.tr+.6;
          if(d<m){
            if(d<.001){dx=Math.random()-.5;dy=Math.random()-.5;d=Math.hypot(dx,dy);}
            const o=m-d;if(o>worst)worst=o;
            const ra=b.tr*b.tr/(a.tr*a.tr+b.tr*b.tr),rb=1-ra,ux=dx/d,uy=dy/d;
            a.tx-=ux*o*ra*.9;a.ty-=uy*o*ra*.9;b.tx+=ux*o*rb*.9;b.ty+=uy*o*rb*.9;
          }
        }
      }
    }
    for(let i=0;i<n;i++){const c=L[i];c.tx=clamp(c.tx,c.tr+1,W-c.tr-1);c.ty=clamp(c.ty,c.tr+1,H-c.tr-1);}
    if(it>10&&worst<.25)break;
  }
  L.forEach(c=>{if(c.x==null){c.x=c.tx;c.y=c.ty;c.r=c.tr;}});
  enter.forEach(c=>{c.x=c.tx;c.y=c.ty;c.r=0;c.free=false;c.vx=c.vy=0;});
  finishLayout(L);
  leaving.forEach(c=>list.push(c));
}

/* ====== SPRITE: logo penuh menutupi bola, resolusi mengikuti zoom ====== */
let curZq=1;
function pill(g,cx,cy,w,h,fill){
  const r=h/2,x=cx-w/2,y=cy-h/2;
  g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.arc(x+w-r,y+r,r,-Math.PI/2,Math.PI/2);g.lineTo(x+r,y+h);g.arc(x+r,y+r,r,Math.PI/2,Math.PI*1.5);g.closePath();
  g.fillStyle=fill;g.fill();
}
function mkSprite(c){
  const k=cls(c),zq=curZq,px=c.tr*zq;
  const S=Math.max(32,Math.min(320,Math.round(px*2*DPR/4)*4)),T=S+2,m=T/2,R=S/2;
  const cn=document.createElement('canvas');cn.width=cn.height=T;const g=cn.getContext('2d');
  g.imageSmoothingQuality='high';
  g.save();g.beginPath();g.arc(m,m,R,0,7);g.clip();
  const im=c.logo&&logoImg[c.logo];
  if(im){g.fillStyle='#fff';g.fillRect(0,0,T,T);try{g.drawImage(im,m-R,m-R,S,S);}catch(e){}}
  else{
    g.fillStyle='#16262d';g.fillRect(0,0,T,T);
    if(!c.logo){g.fillStyle='#8b9ba3';g.font='800 '+Math.round(R*.55)+'px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(c.sym.slice(0,4),m,m);}
  }
  const gl=g.createRadialGradient(m-R*.35,m-R*.4,R*.05,m,m,R);
  gl.addColorStop(0,'rgba(255,255,255,.22)');gl.addColorStop(.45,'rgba(255,255,255,0)');gl.addColorStop(1,'rgba(0,0,0,.16)');
  g.fillStyle=gl;g.fillRect(0,0,T,T);
  g.restore();
  /* gain (update otomatis mengikuti data) */
  const ch=chg(c),mode=px>=26?2:px>=11?1:0;
  if(mode){
    const gtxt=(ch>0?'+':'')+ch.toFixed(Math.abs(ch)>=10?1:2)+'%';
    const tc=k==='g'?'#5dffa0':k==='r'?'#ff7b7b':'#d4c6ff';
    g.textAlign='center';g.textBaseline='middle';
    const put=(txt,f,y,col)=>{
      g.font='800 '+f+'px system-ui,sans-serif';let w=g.measureText(txt).width;
      const mx=R*1.55;if(w>mx){f*=mx/w;g.font='800 '+f+'px system-ui,sans-serif';w=mx;}
      g.lineJoin='round';g.lineWidth=Math.max(1.5,f*.22);g.strokeStyle='rgba(0,0,0,.85)';g.strokeText(txt,m,y);g.fillStyle=col;g.fillText(txt,m,y);
    };
    put(gtxt,mode===2?R*.3:R*.34,m+R*.5,tc);
  }
  c.sp=cn;c.spS=S;c.spT=T;c.spR=c.tr;c.spK=k;c.spFv=flagsVer;c.spTx=ch;c.spZ=zq;c.spL=!!im;
}

let bud=0,prevT=0,lastK=1,zT=0,ldOn=true;
function hideLd(){if(!ldOn)return;ldOn=false;$('ld').classList.add('off');}
setTimeout(hideLd,2200);
function frame(t){
  requestAnimationFrame(frame);

  if(ldOn&&list.length&&!logoWarm)hideLd();
  const dt=clamp((t-(prevT||t))/16.67,.5,3);prevT=t;physics(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  ctx.translate(view.x,view.y);ctx.scale(view.k,view.k);
  const vx0=-view.x/view.k,vy0=-view.y/view.k,vx1=vx0+W/view.k,vy1=vy0+H/view.k;
  const tb=performance.now(),BUDGET=logoWarm?10:(tb<warmUntil?45:10);if(view.k!==lastK){lastK=view.k;zT=t;}else if(t-zT>200)curZq=Math.max(1,Math.ceil(view.k*2)/2);
  for(let i=0;i<list.length;i++){

    if(c.x+pad<vx0||c.x-pad>vx1||c.y+pad<vy0||c.y-pad>vy1)continue;
    if(logoWarm&&c.logo&&!logoImg[c.logo])continue;

    if(!c.sp)continue;

}

/* ====== CHART GARIS ANIMASI (simulasi visual, tanpa API) ====== */
const CH_N=90;let chS=null,chRaf=0;
function chRng(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
  let a=h>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function chBuild(c){
  const d=c.dt||{},P=+c.price||0,rnd=chRng(String(c.sym)),N=CH_N,ch=chg(c)||0;
  /* titik awal = harga penutupan kemarin (dari % perubahan) -> arah garis SELALU searah warna:
     turun = merah, naik = hijau */
  let st=(P>0&&isFinite(ch))?P/(1+ch/100):P;
  if(!isFinite(st)||st<=0)st=P;
  let lo=Math.min(st,P),hi=Math.max(st,P);
  if(d.lo>0&&isFinite(d.lo))lo=Math.min(lo,d.lo);
  if(d.hi>0&&isFinite(d.hi))hi=Math.max(hi,d.hi);
  let w=[0];for(let i=1;i<=N;i++)w.push(w[i-1]+(rnd()+rnd()+rnd()-1.5));
  for(let p=0;p<4;p++){const o=w.slice();for(let i=1;i<N;i++)w[i]=(o[i-1]+2*o[i]+o[i+1])/4;}   // haluskan
  const b=w.map((v,i)=>v-w[N]*i/N);let m=0;b.forEach(v=>{m=Math.max(m,Math.abs(v));});
  const nb=b.map(v=>m?v/m:0);
  let amp=Math.max(Math.abs(P-st)*.5,P*.006);
  const lin=i=>st+(P-st)*i/N;
  const fits=a=>nb.every((v,i)=>{const y=lin(i)+v*a;return y>=lo-1e-9&&y<=hi+1e-9;});
  for(let k=0;k<30&&!fits(amp);k++)amp*=.8;
  const arr=nb.map((v,i)=>lin(i)+v*amp);arr[0]=st;arr[N]=P;
  return{id:c.id,arr,t0:null,price:P};
}
function startChart(c){
  if(!chS||chS.id!==c.id)chS=chBuild(c);
  else if(chS.price!==c.price){chS.price=+c.price;chS.arr[CH_N]=+c.price;}
  const cvs=$('ich');if(cvs)chDraw(cvs,performance.now());
  if(!chRaf)chRaf=requestAnimationFrame(chLoop);
}
function stopChart(){if(chRaf)cancelAnimationFrame(chRaf);chRaf=0;chS=null;}
function chLoop(now){
  chRaf=0;const cvs=$('ich');if(!cvs||!selected||!chS)return;
  chDraw(cvs,now);chRaf=requestAnimationFrame(chLoop);
}
/* kurva mulus (Catmull-Rom -> bezier) */
function chPath(g,P){
  const n=P.length;g.moveTo(P[0][0],P[0][1]);
  for(let i=0;i<n-1;i++){
    const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
    g.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]);
  }
}
function chDraw(cvs,now){
  const r=cvs.getBoundingClientRect(),w=Math.round(r.width),h=Math.round(r.height);if(!w||!h)return;
  if(cvs.width!==w*DPR||cvs.height!==h*DPR){cvs.width=w*DPR;cvs.height=h*DPR;}

  const N=CH_N,A=chS.arr,c=selected,k=cls(c),rgb=COL[k],col='rgb('+rgb+')';
  if(chS.t0==null)chS.t0=now;
  const el=Math.max(0,now-chS.t0),prog=Math.min(1,el/1100),e=.5-.5*Math.cos(Math.PI*prog);
  const ax=v=>Math.abs(v)>=100?nf0.format(v):Math.abs(v)>=1?nf2.format(v):nf3.format(v);
  let mn=Infinity,mx=-Infinity;A.forEach(v=>{if(v<mn)mn=v;if(v>mx)mx=v;});
  if(mx-mn<1e-9){mn-=Math.abs(mn)*.01||1;mx+=Math.abs(mx)*.01||1;}
  const pd=(mx-mn)*.14;mn-=pd;mx+=pd;
  g.font='600 9.5px system-ui,sans-serif';
  const lw=Math.max(...[mn,mx,A[N]].map(v=>g.measureText(ax(v)).width));
  const pl=6,pr=Math.ceil(lw)+12,pt=12,pb=18,cw=w-pl-pr,chh=h-pt-pb;
  const X=i=>pl+cw*i/N,Y=v=>pt+chh*(1-(v-mn)/(mx-mn));
  // label harga (kanan)
  g.textBaseline='middle';g.textAlign='left';g.fillStyle='#6f828b';
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*(1-i/3);g.fillText(ax(v),pl+cw+6,Math.round(Y(v))+.5);}
  // interval waktu (bawah)
  const tl=['09:00','11:00','14:00','16:00'],tf_=[0,2/7,4/7,6/7];
  g.textBaseline='alphabetic';
  tl.forEach((t,i)=>{const x=pl+cw*tf_[i];g.textAlign=i===0?'left':'center';g.fillText(t,i===0?x:x+8,h-5);});
  // titik seri (ekor bergelombang lembut, ujung selalu = harga)
  const K=16,wob=(mx-mn)*.03*Math.min(1,el/800);
  const pts=A.map((v,i)=>{
    let y=v;if(i>N-K&&i<N)y+=Math.sin(Math.PI*(i-(N-K))/K)*wob*Math.sin(now/520+i*.55);
    return[X(i),Y(y),y];
  });
  const fi=e*N,ii=Math.min(N-1,Math.floor(fi)),fr=fi-ii,pa=pts[ii],pb2=pts[ii+1];
  const head=[pa[0]+(pb2[0]-pa[0])*fr,pa[1]+(pb2[1]-pa[1])*fr,pa[2]+(pb2[2]-pa[2])*fr];
  // kurva penuh, dipotong sampai ujung animasi -> gerakan menggambar mulus
  g.save();g.beginPath();g.rect(0,0,head[0]+.5,h);g.clip();
  const gr=g.createLinearGradient(0,pt,0,pt+chh);
  gr.addColorStop(0,'rgba('+rgb+',.30)');gr.addColorStop(1,'rgba('+rgb+',0)');
  g.beginPath();chPath(g,pts);g.lineTo(pts[N][0],pt+chh);g.lineTo(pts[0][0],pt+chh);g.closePath();g.fillStyle=gr;g.fill();
  g.beginPath();chPath(g,pts);
  g.lineWidth=2;g.lineJoin='round';g.lineCap='round';g.strokeStyle=col;g.shadowColor=col;g.shadowBlur=8;g.stroke();
  g.restore();
  // garis putus ke tag harga
  const hv=prog>=1?chS.price:head[2],hy=head[1];
  g.setLineDash([3,3]);g.strokeStyle='rgba('+rgb+',.5)';g.lineWidth=1;
  g.beginPath();g.moveTo(head[0],hy);g.lineTo(pl+cw,hy);g.stroke();g.setLineDash([]);
  // titik live
  const pu=(now%1400)/1400;
  g.beginPath();g.arc(head[0],hy,3+pu*8,0,7);g.fillStyle='rgba('+rgb+','+(.35*(1-pu)).toFixed(3)+')';g.fill();
  g.beginPath();g.arc(head[0],hy,3.2,0,7);g.fillStyle=col;g.fill();
  // tag harga
  g.font='700 9.5px system-ui,sans-serif';
  const txt=ax(hv),tw=g.measureText(txt).width+10,th=16;
  const ty=Math.max(pt-2,Math.min(pt+chh-th+2,hy-th/2));
  g.fillStyle=col;g.beginPath();
  if(g.roundRect)g.roundRect(pl+cw+2,ty,tw,th,4);else g.rect(pl+cw+2,ty,tw,th);
  g.fill();g.fillStyle='#04090c';g.textAlign='left';g.textBaseline='middle';
  g.fillText(txt,pl+cw+7,ty+th/2+.5);
}

/* ====== HEATMAP ====== */
let hmOpen=false;const HM_N=60;
function hmTreemap(items,w,h){
  const tot=items.reduce((a,b)=>a+b.v,0),sc=w*h/tot;items.forEach(i=>{i.a=i.v*sc;});
  const out=[];let rest=items.slice(),rx=0,ry=0,rw=w,rh=h;
  const worst=(row,side)=>{const sm=row.reduce((a,b)=>a+b.a,0);let mx=0,mn=1e18;row.forEach(r=>{if(r.a>mx)mx=r.a;if(r.a<mn)mn=r.a;});return Math.max(side*side*mx/(sm*sm),sm*sm/(side*side*mn));};
  while(rest.length){
    const side=Math.min(rw,rh);let row=[rest[0]],i=1;
    while(i<rest.length){const nr=row.concat(rest[i]);if(worst(nr,side)<=worst(row,side)){row=nr;i++;}else break;}
    rest=rest.slice(i);const sm=row.reduce((a,b)=>a+b.a,0);
    if(rw>=rh){const cw=sm/rh;let yy=ry;row.forEach(r=>{const hh=r.a/cw;out.push({it:r,x:rx,y:yy,w:cw,h:hh});yy+=hh;});rx+=cw;rw-=cw;}
    else{const rhh=sm/rw;let xx=rx;row.forEach(r=>{const ww=r.a/rhh;out.push({it:r,x:xx,y:ry,w:ww,h:rhh});xx+=ww;});ry+=rhh;rh-=rhh;}
  }
  return out;
}
/* merah turun / hijau naik: makin besar gain makin tua; netral abu-abu */
function hmCol(c){
  const g=chg(c);
  if(cls(c)==='p')return{bg:'#3a434a',fg:'#fff'};
  const up=g>0,t=Math.min(1,Math.abs(g)/(up?4:6));
  /* hijau muda terang / merah muda terang; makin besar gain makin pekat sedikit */
  const A=up?[[150,255,190],[70,230,135]]:[[255,175,195],[255,105,140]];
  const m=A[0].map((v,i)=>Math.round(v+(A[1][i]-v)*t));
  return{bg:'rgb('+m.join(',')+')',fg:up?'#06361c':'#4a0618'};
}
function renderHm(){
  const box=$('hmc'),W0=box.clientWidth,H0=box.clientHeight;if(!W0||!H0||!coins.length)return;
  const HM_POW=1.5;   // >1 = selisih ukuran makin tajam (besar makin besar, kecil makin kecil)
  const items=coins.map(c=>({c,v:Math.pow(Math.max(c.cap||0,1),HM_POW)})).sort((a,b)=>b.v-a.v);
  items.forEach((it,i)=>{it.rk=i;});
  $('hmn').textContent=items.length.toLocaleString('id-ID');
  const esc=x=>String(x).replace(/</g,'&lt;');
  let h='';
  hmTreemap(items,W0,H0).forEach(t=>{
    const c=t.it.c;if(t.w<1||t.h<1)return;
    const col=hmCol(c),mn=Math.min(t.w,t.h),gp=mn>=10?1:0,lg=c.logo&&logoSrc[c.logo];
    const W1=t.w-gp,H1=t.h-gp,sym=esc(c.sym);
    let inner='';
    if(t.it.rk<20){                               // 20 market cap tertinggi: logo + kode + gain, ukuran besar
      let f=Math.min(clamp(mn*.19,9,22),(W1-6)/(Math.max(String(c.sym).length,4)*.7));
      let ls=clamp(mn*.4,18,60);
      const k=Math.min(1,(H1-4)/((lg?ls+3:0)+f*2.35));
      if(k<1){f*=k;ls*=k;}
      ls=Math.round(ls);
      inner=(lg?'<img alt="" width="'+ls+'" height="'+ls+'" src="'+lg+'" style="margin-bottom:'+Math.max(1,ls*.06).toFixed(1)+'px">':'')+'<b style="font-size:'+f.toFixed(1)+'px">'+sym+'</b><small style="font-size:'+(f*.8).toFixed(1)+'px">'+fmtC(chg(c))+'</small>';
    }else if(mn>=15&&lg){                         // market cap menengah: logo saja
      const ls=Math.floor(Math.min(mn*.62,mn-5));
      inner='<img alt="" width="'+ls+'" height="'+ls+'" src="'+lg+'" style="margin:0">';
    }                                             // market cap kecil: kotak warna saja
    h+='<div class="ht" data-id="'+c.id+'" style="left:'+(t.x+gp*.5).toFixed(1)+'px;top:'+(t.y+gp*.5).toFixed(1)+'px;width:'+(t.w-gp).toFixed(1)+'px;height:'+(t.h-gp).toFixed(1)+'px;background:'+col.bg+';color:'+col.fg+'">'+inner+'</div>';
  });
  box.innerHTML=h;
}
function openHm(){hmOpen=true;$('hmbd').style.display='block';$('hm').style.display='flex';renderHm();}

$('bd').addEventListener('click',e=>{e.stopPropagation();if(performance.now()-shownAt>450)hideInfo();});

/* ====== DAFTAR SAHAM (search) ====== */
let lpOpen=false,lpSort='gain',lpShown=0;const LP_STEP=80;
function lpSorted(){
  const a=coins.slice();
  if(lpSort==='pop')a.sort((x,y)=>(y.cap||0)-(x.cap||0));
  else if(lpSort==='vol')a.sort((x,y)=>y.tv-x.tv);
  else if(lpSort==='gain')a.sort((x,y)=>chg(y)-chg(x));
  else a.sort((x,y)=>chg(x)-chg(y));
  return a;
}
function lpRows(arr,from,to){
  let h='';
  for(let i=from;i<to&&i<arr.length;i++){
    const o=arr[i],c=o.c,k=cls(c),lg=c.logo&&logoSrc[c.logo];
    const meta=lpSort==='pop'?'MCap '+fmtCap(c.cap):lpSort==='vol'?'Vol '+(c.dt.vol?nfc.format(c.dt.vol):'-'):'';
    h+='<div class="rw" data-id="'+c.id+'"><span class="rk">'+(o.rk)+'</span>'
      +(lg?'<img alt="" loading="lazy" src="'+lg+'">':'<div class="ph">'+c.sym.slice(0,3)+'</div>')
      +'<div class="nm">'+c.sym+'<small>'+(meta?meta+' · ':'')+String(c.name).replace(/</g,'&lt;')+'</small></div>'
      +'<div class="pv">'+fmtP(c.price)+'<small class="'+css(k)+'">'+fmtC(chg(c))+'</small></div></div>';
  }
  return h;
}
let lpArr=[];
function renderList(keep){
  const q=$('lq').value.trim().toLowerCase(),box=$('lst');
  const all=lpSorted().map((c,i)=>({c:c,rk:i+1}));
  lpArr=q?all.filter(o=>o.c.sym.toLowerCase().indexOf(q)>=0||String(o.c.name).toLowerCase().indexOf(q)>=0):all;
  const top=keep?box.scrollTop:0;
  lpShown=keep?Math.max(LP_STEP,lpShown):LP_STEP;
  box.innerHTML=lpArr.length?lpRows(lpArr,0,lpShown):'<div class="lemp">Saham tidak ditemukan</div>';
  box.scrollTop=top;
}
function openList(){

$('lseg').onclick=e=>{

};
$('lst').addEventListener('scroll',()=>{

  if(lpShown<lpArr.length&&b.scrollTop+b.clientHeight>b.scrollHeight-400){

$('lst').addEventListener('click',e=>{

/* ====== ZOOM / PAN / TAP ====== */
function clampView(){view.x=clamp(view.x,W-W*view.k,0);view.y=clamp(view.y,H-H*view.k,0);$('reset').style.display=view.k>1.02?'block':'none';}
function zoomAt(cx,cy,nk){nk=clamp(nk,1,10);const wx=(cx-view.x)/view.k,wy=(cy-view.y)/view.k;view.k=nk;view.x=cx-wx*nk;view.y=cy-wy*nk;clampView();}
$('reset').onclick=()=>{view.k=1;view.x=view.y=0;clampView();};
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,view.k*(e.deltaY<0?1.18:1/1.18));},{passive:false});
const ptrs=new Map();let drag=null,pinch=null,moved=0,gest=false;
let held=null,hoff=null,hist=[],holdMoved=false,sx=0,sy=0;
function resetPtr(){ptrs.clear();held=null;drag=null;pinch=null;gest=false;holdMoved=false;}
const pd=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const toW=(px,py)=>({x:(px-view.x)/view.k,y:(py-view.y)/view.k});
function hit(px,py){
  const w=toW(px,py);let best=null,bs=1e9;
  for(const c of list){if(c.out)continue;const rr=Math.max(c.r,7/view.k),d=Math.hypot(c.x-w.x,c.y-w.y);if(d<=rr){const sc=d/rr;if(sc<bs){bs=sc;best=c;}}}
  return best;
}
cv.addEventListener('pointerdown',e=>{
  if(e.isPrimary)resetPtr();
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(ptrs.size===1){
    moved=0;gest=false;holdMoved=false;sx=e.offsetX;sy=e.offsetY;
    const b=$('info').style.display==='block'?null:hit(e.offsetX,e.offsetY);
    if(b){const w=toW(e.offsetX,e.offsetY);held=b;hoff={x:b.x-w.x,y:b.y-w.y};hist=[{t:performance.now(),x:w.x,y:w.y}];drag=null;}
    else{held=null;drag={x:e.offsetX,y:e.offsetY,vx:view.x,vy:view.y};}
  }else if(ptrs.size===2){gest=true;drag=null;held=null;const [a,b]=[...ptrs.values()];pinch={d:pd(a,b),k:view.k};}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.k*pd(a,b)/pinch.d);}
  else if(held){
    moved=Math.max(moved,Math.hypot(e.offsetX-sx,e.offsetY-sy));
    if(moved>=6){
      holdMoved=true;held.free=true;
      const w=toW(e.offsetX,e.offsetY),now=performance.now();
      held.x=clamp(w.x+hoff.x,held.r,W-held.r);held.y=clamp(w.y+hoff.y,held.r,H-held.r);
      hist.push({t:now,x:w.x,y:w.y});while(hist.length>2&&now-hist[0].t>100)hist.shift();
      if(hist.length>=2){const f=hist[0],l=hist[hist.length-1],dt=Math.max(8,l.t-f.t);held.vx=(l.x-f.x)/dt*16.7;held.vy=(l.y-f.y)/dt*16.7;}
    }
  }
  else if(drag){const dx=e.offsetX-drag.x,dy=e.offsetY-drag.y;moved+=Math.abs(e.movementX||0)+Math.abs(e.movementY||0);view.x=drag.vx+dx;view.y=drag.vy+dy;clampView();}
});
function up(e){
  if(!ptrs.has(e.pointerId))return;
  const wasTap=ptrs.size===1&&!gest&&moved<8&&e.type==='pointerup';
  ptrs.delete(e.pointerId);
  if(held){
    const b=held;held=null;
    if(holdMoved){
      let vx=0,vy=0;const now=performance.now();
      if(hist.length>=2&&now-hist[hist.length-1].t<90){const f=hist[0],l=hist[hist.length-1],dt=Math.max(8,l.t-f.t);vx=(l.x-f.x)/dt*16.7;vy=(l.y-f.y)/dt*16.7;}
      const sp=Math.hypot(vx,vy),mx=45;if(sp>mx){vx*=mx/sp;vy*=mx/sp;}
      b.vx=vx;b.vy=vy;b.free=true;b.st=0;
    }else if(wasTap)tap(e.offsetX,e.offsetY);
  }else if(wasTap)tap(e.offsetX,e.offsetY);
  if(ptrs.size<2)pinch=null;
  if(ptrs.size===1&&!held){const p=[...ptrs.values()][0];drag={x:p.x,y:p.y,vx:view.x,vy:view.y};}else drag=null;
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function tap(px,py){
  if($('info').style.display==='block')return;
  const b=hit(px,py);b?showInfo(b):hideInfo();
}

/* ====== FISIKA: geser & lempar gelembung ====== */
function physics(dt){
  const n=list.length,hm=h=>h===held&&holdMoved,ez=1-Math.pow(.72,dt);
  for(let i=0;i<n;i++){
    const c=list[i];c.r+=(c.tr-c.r)*ez;
    if(hm(c)){const f=Math.pow(.8,dt);c.vx*=f;c.vy*=f;continue;}
    if(c.free){
      c.x+=c.vx*dt;c.y+=c.vy*dt;const f=Math.pow(.985,dt);c.vx*=f;c.vy*=f;
      if(c.x<c.r){c.x=c.r;c.vx=Math.abs(c.vx)*.8;}else if(c.x>W-c.r){c.x=W-c.r;c.vx=-Math.abs(c.vx)*.8;}
      if(c.y<c.r){c.y=c.r;c.vy=Math.abs(c.vy)*.8;}else if(c.y>H-c.r){c.y=H-c.r;c.vy=-Math.abs(c.vy)*.8;}
    }else{c.x+=(c.tx-c.x)*ez;c.y+=(c.ty-c.y)*ez;}
  }
  for(let i=0;i<n;i++){
    const a=list[i],aAct=a.free||hm(a);if(!aAct)continue;
    for(let j=0;j<n;j++){
      if(j===i)continue;const b=list[j],bAct=b.free||hm(b);
      if(bAct&&j<i)continue;
      const dx=b.x-a.x,dy=b.y-a.y,m=a.r+b.r;
      if(Math.abs(dx)>m||Math.abs(dy)>m)continue;
      const d=Math.hypot(dx,dy);if(d>=m||d<.001)continue;
      const nx=dx/d,ny=dy/d,o=m-d;
      const ia=hm(a)?0:1/(a.r*a.r),ib=hm(b)?0:1/(b.r*b.r),is=ia+ib;if(!is)continue;
      a.x-=nx*o*ia/is;a.y-=ny*o*ia/is;b.x+=nx*o*ib/is;b.y+=ny*o*ib/is;
      const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
      if(vn<0){const jj=-(1+.7)*vn/is;a.vx-=jj*ia*nx;a.vy-=jj*ia*ny;b.vx+=jj*ib*nx;b.vy+=jj*ib*ny;}
      if(!b.free&&!hm(b)){b.free=true;b.st=0;}
      if(!a.free&&!hm(a)){a.free=true;a.st=0;}
    }
  }
  for(let i=0;i<n;i++){
    const c=list[i];if(!c.free||hm(c))continue;
    if(Math.hypot(c.vx,c.vy)<.08){if(++c.st>25){c.free=false;c.tx=clamp(c.x,c.tr+1,W-c.tr-1);c.ty=clamp(c.y,c.tr+1,H-c.tr-1);c.vx=c.vy=0;}}
    else c.st=0;
  }
  if(list.some(c=>c.out&&c.r<.4))list=list.filter(c=>!(c.out&&c.r<.4));
}

/* ====== RESIZE ====== */
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  if(w===W&&h===H)return;
  if(W&&H){coins.forEach(c=>{if(c.x!=null){c.x*=w/W;c.y*=h/H;c.tx*=w/W;c.ty*=h/H;}});}
  W=w;H=h;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  view.k=1;view.x=view.y=0;clampView();
  coins.forEach(c=>c.sp=null);
  relayout();
}
let rt;new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(resize,120);}).observe(stage);

/* ====== START: cache dulu -> bendera & harga langsung tampil ====== */
resize();
if(loadCache()){demo=false;relayout();refreshUI();requestLogos();}else{$('sub').textContent='Memuat data TradingView…';}
requestAnimationFrame(frame);
load();
setInterval(()=>{if(!document.hidden&&!demo)load();},REFRESH_MS);
let leftForChart=false;
$('info').addEventListener('click',e=>{if(e.target.closest('a'))leftForChart=true;});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  resetPtr();
  if(leftForChart){leftForChart=false;hideInfo();}
  if(Date.now()-lastT>15000)load();
});
window.addEventListener('pageshow',()=>{resetPtr();});
})();
